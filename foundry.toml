[profile.default]
src = "contracts"
test = "contracts/test"
out = "target/foundry/out"
cache_path = "target/foundry/cache"
libs = []
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true
use_literal_content = false
test_failures_file = "target/foundry/test-failures"

[profile.default.fuzz]
runs = 256
seed = "0x65636f72702d626173652d72656769737472792d7631"
failure_persist_dir = "target/foundry/fuzz"

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = true
failure_persist_dir = "target/foundry/invariant"
