name: Evidence scanner

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify native scanner and non-Unicode packet admission
        run: cargo test --locked -p crony-runner --bin crony-evidence-paths
      - name: Verify scanner behavior, build provenance and launch races
        run: node --test tools/check_evidence_personal_paths.test.mjs tools/check_evidence_native_build.test.mjs tools/check_evidence_launch.test.mjs
