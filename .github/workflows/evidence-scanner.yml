name: Evidence scanner

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify native scanner and non-Unicode packet admission
        run: cargo test --locked -p crony-runner --bin crony-evidence-paths
      - name: Verify scanner behavior, build provenance and launch races
        run: node --test tools/check_evidence_personal_paths.test.mjs tools/check_evidence_native_build.test.mjs tools/check_evidence_launch.test.mjs
