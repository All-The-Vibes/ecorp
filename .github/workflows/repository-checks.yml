name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-regressions:
    name: Node regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare test reports
        id: reports
        run: >-
          node -e "require('node:fs').mkdirSync('output/repository-checks', { recursive: true })"
      - name: Check documentation contracts
        run: pnpm check:docs
      - name: Run web and tool regressions
        if: ${{ !cancelled() && steps.reports.outcome == 'success' }}
        # Quote the narrow globs so Node expands them identically on both platforms.
        # Real-stack e2e_*.mjs drivers and output directories are outside this scope.
        run: >-
          node --test --test-concurrency=2 --test-timeout=180000
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=output/repository-checks/unit.xml
          "apps/web/src/**/*.test.mjs" "tools/*.test.mjs"
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-checks-${{ matrix.os }}
          path: output/repository-checks/unit.xml
          if-no-files-found: error
          retention-days: 14

  web-model-coverage:
    name: Web model coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Measure every declared production web model
        run: node tools/coverage_web_models.mjs --output output/coverage/web-models-ci
      - name: Preserve scoped coverage and source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-model-coverage
          path: output/coverage/web-models-ci/
          if-no-files-found: warn
          retention-days: 14
