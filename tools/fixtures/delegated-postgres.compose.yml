name: ecorp-obo-285
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crony
      POSTGRES_DB: crony
      POSTGRES_PASSWORD: ${ECORP_DELEGATED_POSTGRES_PASSWORD:?Set a locally generated database password}
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - delegated-postgres:/var/lib/postgresql/data
volumes:
  delegated-postgres:
