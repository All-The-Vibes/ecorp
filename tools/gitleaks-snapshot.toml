title = "ECorp source snapshot secret detection"
# Selected explicitly by the snapshot workflow and its canary. Keep this file out
# of Gitleaks' root auto-discovery so the existing history and staged scans retain
# their default rules and independently reviewed fingerprint exceptions.
[extend]
useDefault = true

[allowlist]
description = "Generated dependencies, build output, Git metadata and local evidence are not repository source"
paths = ['''(^|[\\/])(node_modules|target|target-audit|\.git|output)[\\/]''']

# These exact historical fixture fields identify replay operations, not credentials.
# Do not ignore entire evidence directories or API-key-shaped values elsewhere.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Non-secret fixture/replay identifiers in three reviewed test artifacts"
condition = "AND"
paths = [
  '''^docs/evidence/2026-09-08-room-context-browser\.json$''',
  '''^docs/evidence/assets/predispatch-failure/runtime\.json$''',
  '''^tools/e2e_factory_run_activity\.py$''',
]
regexTarget = "match"
regexes = ['''(idempotency_key|fixture_key)["']?\s*:\s*["']''']

# Individually reviewed public queue artifacts. Each exception requires BOTH
# its exact repository path and its complete, anchored non-secret match.
# New values, fields, paths and provider-token rules remain detectable.

[[rules.allowlists]]
description = "synthetic-fixture-reference"
condition = "AND"
regexTarget = "match"
paths = ['''^crates/crony-server/src/base_worker_tests\.rs$''']
regexes = [
  '''^\Qsecondary_rpc_secret: "fixture/secondary"\E$''',
]

[[rules.allowlists]]
description = "synthetic-fixture-reference"
condition = "AND"
regexTarget = "match"
paths = ['''^crates/crony-server/src/native_fixture\.rs$''']
regexes = [
  '''^\Qsecondary_rpc_secret: "fixture/secondary"\E$''',
]

[[rules.allowlists]]
description = "ordinary-prose"
condition = "AND"
regexTarget = "match"
paths = ['''^docs/MULTIPLAYER_ACCEPTANCE_V1\.md$''']
