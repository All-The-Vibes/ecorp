[package]
name = "crony-server"
default-run = "crony-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "crony-base-worker"
path = "src/base_worker.rs"

[features]
default = []
native-qualification = ["crony-base/test-support", "crony-base/gateway-service", "crony-audit/test-support", "dep:alloy"]

[[bin]]
name = "crony-native-fixture"
path = "src/native_fixture.rs"
required-features = ["native-qualification"]

[dependencies]
alloy = { version = "=1.8.3", default-features = false, features = ["signer-local"], optional = true }
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
crony-domain = { path = "../crony-domain" }
crony-audit = { path = "../crony-audit" }
crony-base = { path = "../crony-base" }
crony-protocol = { path = "../crony-protocol" }
crony-store = { path = "../crony-store" }
dashmap.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
mime.workspace = true
object_store.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
alloy = { version = "=1.8.3", default-features = false, features = ["signer-local"] }
crony-base = { path = "../crony-base", features = ["gateway-service", "test-support"] }
rsa = "0.9"
