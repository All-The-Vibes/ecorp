[package]
name = "crony-base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
aws-kms = ["alloy/signer-aws", "dep:aws-sdk-kms"]
gateway-service = ["dep:axum"]
test-support = []

[dependencies]
alloy = { version = "=1.8.3", default-features = false, features = ["std", "consensus", "eips", "sol-types", "rpc-types", "serde", "signers", "network", "k256"] }
async-trait.workspace = true
axum = { workspace = true, optional = true }
aws-sdk-kms = { version = "=1.77.0", optional = true, default-features = false, features = ["rt-tokio", "rustls"] }
blake3 = "1"
chrono.workspace = true
crony-audit = { path = "../crony-audit" }
ed25519-dalek = "2"
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sqlx.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
alloy = { version = "=1.8.3", default-features = false, features = ["signer-local"] }
