<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000" role="img" aria-labelledby="title desc">
<title id="title">MULTIPLAYER. ONE SHARED MISSION.</title><desc id="desc">Alice holds a steering lease while Bob can comment, queue direction and review according to his role. Both use one authoritative server; the independent runner survives client closure.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#182d3c"/></marker></defs>
<style>text{font-family:"Space Grotesk","Segoe UI",Arial,sans-serif}svg{background:#fff7e6}</style>
<rect x="0" y="0" width="1680" height="1000" rx="0" fill="#fff7e6" stroke="#182d3c" stroke-width="2"/>
<rect x="0" y="0" width="1680" height="172" rx="0" fill="#10232e" stroke="#10232e" stroke-width="2"/>
<image href="data:image/svg+xml;base64," x="48" y="42" width="70" height="70"/>
<text x="154" y="88" fill="#fff7e6" font-size="51" font-weight="700" text-anchor="start">MULTIPLAYER. ONE SHARED MISSION.</text>
<text x="154" y="132" fill="#c7e1d9" font-size="26" font-weight="400" text-anchor="start">People collaborate. Authority stays explicit.</text>
<path d="M0 174H1680" stroke="#b64b36" stroke-width="6"/>
<rect x="60" y="259" width="382" height="151" rx="4" fill="#f8dfd3" stroke="#182d3c" stroke-width="2"/><text x="84" y="301" fill="#182d3c" font-size="28" font-weight="700" text-anchor="start">Alice · controller</text><text x="84" y="343" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Steer with a control lease</text><text x="84" y="376" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Current, fenced authority</text><rect x="60" y="483" width="382" height="151" rx="4" fill="#d6ebe5" stroke="#182d3c" stroke-width="2"/><text x="84" y="525" fill="#182d3c" font-size="28" font-weight="700" text-anchor="start">Bob · teammate</text><text x="84" y="567" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Comment · queue · review</text><text x="84" y="600" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Each action checks its role</text><path d="M110 428V463" fill="none" stroke="#182d3c" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="145" y="453" fill="#16756d" font-size="24" font-weight="700" text-anchor="start">Fenced handoff</text><rect x="596" y="293" width="511" height="282" rx="4" fill="#f5ecd8" stroke="#182d3c" stroke-width="2"/><text x="620" y="335" fill="#182d3c" font-size="28" font-weight="700" text-anchor="start">One authoritative mission</text><text x="620" y="377" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Room and member scope</text><text x="620" y="410" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Exact task and run context</text><text x="620" y="443" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Attributed, durable decisions</text><text x="620" y="476" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Control Server + Postgres</text><path d="M460 333H552V365H577" fill="none" stroke="#182d3c" stroke-width="3" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M460 560H552V506H577" fill="none" stroke="#182d3c" stroke-width="3" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="487" y="283" fill="#182d3c" font-size="20" font-weight="600" text-anchor="start">Commands</text><text x="470" y="606" fill="#182d3c" font-size="18" font-weight="600" text-anchor="start">Comments / updates</text><rect x="1272" y="336" width="348" height="202" rx="4" fill="#d6ebe5" stroke="#182d3c" stroke-width="2"/><text x="1296" y="378" fill="#182d3c" font-size="28" font-weight="700" text-anchor="start">Independent runner</text><text x="1296" y="420" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Provider session</text><text x="1296" y="453" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Task worktree</text><text x="1296" y="486" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Verification and evidence</text><path d="M1125 405L1252 405" fill="none" stroke="#182d3c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1252 480L1125 480" fill="none" stroke="#182d3c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1187" y="373" fill="#182d3c" font-size="17" font-weight="600" text-anchor="middle">Tasks / controls</text><text x="1187" y="520" fill="#182d3c" font-size="17" font-weight="600" text-anchor="middle">Events / evidence</text><text x="1446" y="582" fill="#16756d" font-size="22" font-weight="600" text-anchor="middle">Runner connects out.</text><text x="60" y="687" fill="#16756d" font-size="26" font-weight="700" text-anchor="start">SHARED HISTORY. DISTINCT ACTIONS.</text><rect x="60" y="722" width="480" height="159" rx="4" fill="#fff7e6" stroke="#182d3c" stroke-width="2"/><text x="84" y="764" fill="#182d3c" font-size="28" font-weight="700" text-anchor="start">Reconnect &amp; replay</text><text x="84" y="806" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Visible committed events return</text><text x="84" y="839" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">without inventing a new mission.</text><rect x="600" y="722" width="480" height="159" rx="4" fill="#fff7e6" stroke="#182d3c" stroke-width="2"/><text x="624" y="764" fill="#182d3c" font-size="28" font-weight="700" text-anchor="start">Freshness is explicit</text><text x="624" y="806" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">A live socket is not proof</text><text x="624" y="839" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">of a fresh mission snapshot.</text><rect x="1140" y="722" width="480" height="159" rx="4" fill="#fff7e6" stroke="#182d3c" stroke-width="2"/><text x="1164" y="764" fill="#182d3c" font-size="28" font-weight="700" text-anchor="start">Review stays a decision</text><text x="1164" y="806" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Comments do not approve work.</text><text x="1164" y="839" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Hashes do not grant permission.</text><rect x="60" y="921" width="1560" height="50" rx="4" fill="#10232e" stroke="#10232e" stroke-width="2"/><text x="840" y="954" fill="#fff7e6" font-size="27" font-weight="700" text-anchor="middle">Closing a browser does not end the run.</text></svg>