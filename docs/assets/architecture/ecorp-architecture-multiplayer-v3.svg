<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000" role="img" aria-labelledby="title desc">
<title id="title">HOW ECORP WORKS</title><desc id="desc">Multiple human clients share one control server. Outbound runners execute mission-shaped work in isolated worktrees. Built-in provenance spans source, contributors, evidence and acceptance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#182d3c"/></marker></defs>
<style>text{font-family:"Space Grotesk","Segoe UI",Arial,sans-serif}svg{background:#fff7e6}</style>
<rect x="0" y="0" width="1680" height="1000" rx="0" fill="#fff7e6" stroke="#182d3c" stroke-width="2"/>
<rect x="0" y="0" width="1680" height="172" rx="0" fill="#10232e" stroke="#10232e" stroke-width="2"/>
<image href="data:image/svg+xml;base64," x="48" y="42" width="70" height="70"/>
<text x="154" y="88" fill="#fff7e6" font-size="51" font-weight="700" text-anchor="start">HOW ECORP WORKS</text>
<text x="154" y="132" fill="#c7e1d9" font-size="26" font-weight="400" text-anchor="start">Shared mission. Dynamic team. Verified delivery.</text>
<path d="M0 174H1680" stroke="#b64b36" stroke-width="6"/>
<text x="48" y="230" fill="#16756d" font-size="28" font-weight="700" text-anchor="start">PEOPLE &amp; CLIENTS</text><text x="576" y="230" fill="#16756d" font-size="28" font-weight="700" text-anchor="start">COLLABORATION &amp; CONTROL</text><text x="1250" y="230" fill="#16756d" font-size="28" font-weight="700" text-anchor="start">EXECUTION</text><rect x="48" y="266" width="390" height="290" rx="4" fill="#f8dfd3" stroke="#182d3c" stroke-width="2"/><text x="72" y="308" fill="#182d3c" font-size="28" font-weight="700" text-anchor="start">One shared office</text><text x="72" y="350" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Web · Desktop · CLI</text><text x="72" y="383" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Rooms and discussion</text><text x="72" y="416" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Control handoff and review</text><text x="72" y="449" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Many people. Shared context.</text><rect x="576" y="266" width="528" height="290" rx="4" fill="#d6ebe5" stroke="#182d3c" stroke-width="2"/><text x="600" y="308" fill="#182d3c" font-size="28" font-weight="700" text-anchor="start">ECorp Control Server</text><text x="600" y="350" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Missions and bounded task graphs</text><text x="600" y="383" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Membership and control leases</text><text x="600" y="416" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Approvals, budgets and events</text><text x="600" y="449" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Authoritative state in Postgres</text><rect x="1250" y="266" width="382" height="290" rx="4" fill="#f5ecd8" stroke="#182d3c" stroke-width="2"/><text x="1274" y="308" fill="#182d3c" font-size="28" font-weight="700" text-anchor="start">Outbound runners</text><text x="1274" y="350" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Mission-shaped specialists</text><text x="1274" y="383" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Isolated task worktrees</text><text x="1274" y="416" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Provider supervision</text><text x="1274" y="449" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Verification and export</text><path d="M456 361L557 361" fill="none" stroke="#182d3c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M557 424L456 424" fill="none" stroke="#182d3c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="506" y="337" fill="#182d3c" font-size="18" font-weight="600" text-anchor="middle">Commands</text><text x="506" y="461" fill="#182d3c" font-size="18" font-weight="600" text-anchor="middle">Live updates</text><path d="M1121 361L1230 361" fill="none" stroke="#182d3c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1230 424L1121 424" fill="none" stroke="#182d3c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1175" y="322" fill="#182d3c" font-size="18" font-weight="600" text-anchor="middle">Tasks +</text><text x="1175" y="344" fill="#182d3c" font-size="18" font-weight="600" text-anchor="middle">controls</text><text x="1175" y="454" fill="#182d3c" font-size="18" font-weight="600" text-anchor="middle">Events +</text><text x="1175" y="477" fill="#182d3c" font-size="18" font-weight="600" text-anchor="middle">artifacts</text><text x="1441" y="591" fill="#16756d" font-size="21" font-weight="600" text-anchor="middle">Runner initiates the connection.</text><rect x="576" y="605" width="252" height="103" rx="4" fill="#fff7e6" stroke="#182d3c" stroke-width="2"/><text x="600" y="647" fill="#182d3c" font-size="28" font-weight="700" text-anchor="start">Postgres</text><text x="600" y="689" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">State + event history</text><rect x="852" y="605" width="252" height="103" rx="4" fill="#fff7e6" stroke="#182d3c" stroke-width="2"/><text x="876" y="647" fill="#182d3c" font-size="28" font-weight="700" text-anchor="start">Private storage</text><text x="876" y="689" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Evidence + source</text><text x="48" y="623" fill="#182d3c" font-size="25" font-weight="700" text-anchor="start">The screen is replaceable.</text><text x="48" y="661" fill="#182d3c" font-size="24" font-weight="400" text-anchor="start">The runner survives the UI.</text><text x="1250" y="641" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">Runtime capabilities,</text><text x="1250" y="676" fill="#182d3c" font-size="23" font-weight="400" text-anchor="start">not a fixed agent count.</text><rect x="48" y="747" width="1584" height="99" rx="4" fill="#10232e" stroke="#10232e" stroke-width="2"/><text x="75" y="787" fill="#fff7e6" font-size="23" font-weight="700" text-anchor="start">BUILT-IN TRUST FABRIC</text><path d="M437 771V825" stroke="#f6a58c" stroke-width="7"/><text x="455" y="808" fill="#fff7e6" font-size="22" font-weight="600" text-anchor="start">Pinned source</text><path d="M729 771V825" stroke="#79cbb9" stroke-width="7"/><text x="747" y="808" fill="#fff7e6" font-size="22" font-weight="600" text-anchor="start">Contributors</text><path d="M1021 771V825" stroke="#b8d1e5" stroke-width="7"/><text x="1039" y="808" fill="#fff7e6" font-size="22" font-weight="600" text-anchor="start">Evidence fingerprints</text><path d="M1313 771V825" stroke="#ebce84" stroke-width="7"/><text x="1331" y="808" fill="#fff7e6" font-size="22" font-weight="600" text-anchor="start">Acceptance rules</text><text x="48" y="892" fill="#16756d" font-size="23" font-weight="700" text-anchor="start">VERIFIED DELIVERY</text><rect x="48" y="915" width="358" height="54" rx="4" fill="#fff7e6" stroke="#182d3c" stroke-width="2"/><text x="227" y="949" fill="#182d3c" font-size="23" font-weight="600" text-anchor="middle">Verified source</text><path d="M415 942L444 942" fill="none" stroke="#182d3c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="456" y="915" width="358" height="54" rx="4" fill="#fff7e6" stroke="#182d3c" stroke-width="2"/><text x="635" y="949" fill="#182d3c" font-size="23" font-weight="600" text-anchor="middle">Human authorization</text><path d="M823 942L852 942" fill="none" stroke="#182d3c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="864" y="915" width="358" height="54" rx="4" fill="#fff7e6" stroke="#182d3c" stroke-width="2"/><text x="1043" y="949" fill="#182d3c" font-size="23" font-weight="600" text-anchor="middle">Trusted publisher</text><path d="M1231 942L1260 942" fill="none" stroke="#182d3c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1272" y="915" width="358" height="54" rx="4" fill="#fff7e6" stroke="#182d3c" stroke-width="2"/><text x="1451" y="949" fill="#182d3c" font-size="23" font-weight="600" text-anchor="middle">Pull request</text></svg>